<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mighty Monuments</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <section class="hero">

      <div class="badge">
        Java Multiplayer Strategy Game
      </div>

      <img
        class="logo"
        src="resources/Mighty_Monuments.png"
        alt="Mighty Monuments"
      />

      <p class="subtitle">
        Collect resources, build ancient monuments, and compete against other players.
      </p>

      <a
        id="downloadButton"
        class="download-button"
        href="downloads/example-project-0.0.1-ALPHA-all.jar"
        download
      >
        Download Game
      </a>

      <div class="progress-card">
        <div class="progress-info">
          <span id="downloadText">Loading...</span>
          <span id="statusText">Connecting...</span>
        </div>

        <div class="progress-wrapper">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
